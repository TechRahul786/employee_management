{% extends "base.html" %}
{% block title %}Add Employee{% endblock %} 
{% block content %}

<div class="max-w-4xl mx-auto mt-10">
  <div class="bg-white rounded-xl shadow-lg p-8">
    <h2 class="text-3xl font-bold text-slate-800 mb-8">Add Employee</h2>

    {% if messages %}
    {% for message in messages %}
        <div class="mb-4 p-3 rounded-lg bg-green-100 text-green-700 border border-green-300">
            {{ message }}
        </div>
    {% endfor %}
{% endif %}

    <form method="POST" enctype="multipart/form-data">
      {% csrf_token %}

      <div class="grid md:grid-cols-2 gap-6">
        <div>
          <label class="block mb-2 font-medium"> Full Name </label>

          <input
            type="text"
            name="name"
            class="w-full border rounded-lg px-4 py-3 focus:ring-2 focus:ring-blue-500 outline-none"
            placeholder="Enter employee name"
            required
          />
        </div>

        <div>
          <label class="block mb-2 font-medium"> Email </label>

          <input
            type="email"
            name="email"
            class="w-full border rounded-lg px-4 py-3 focus:ring-2 focus:ring-blue-500 outline-none"
            placeholder="Enter email"
            required
          />
        </div>

        <div>
          <label class="block mb-2 font-medium"> Phone </label>

          <input
            type="text"
            name="phone"
            class="w-full border rounded-lg px-4 py-3 focus:ring-2 focus:ring-blue-500 outline-none"
            placeholder="Enter phone number"
            required
          />
        </div>

        <div>
          <label class="block mb-2 font-medium"> Department </label>

          <input
            type="text"
            name="department"
            class="w-full border rounded-lg px-4 py-3 focus:ring-2 focus:ring-blue-500 outline-none"
            placeholder="IT / HR / Sales"
            required
          />
        </div>

        <div>
          <label class="block mb-2 font-medium"> Salary </label>

          <input
            type="number"
            step="0.01"
            name="salary"
            class="w-full border rounded-lg px-4 py-3 focus:ring-2 focus:ring-blue-500 outline-none"
            placeholder="25000"
            required
          />
        </div>

        <div>
          <label class="block mb-2 font-medium"> Joining Date </label>

          <input
            type="date"
            name="joining_date"
            class="w-full border rounded-lg px-4 py-3 focus:ring-2 focus:ring-blue-500 outline-none"
            required
          />
        </div>

        <div>
          <label class="block mb-2 font-medium"> Employee Photo </label>

          <input
            type="file"
            name="image"
            accept="image/*"
            class="w-full border rounded-lg px-4 py-3"
          />
        </div>
      </div>

      <div class="flex gap-4 mt-8">
        <button
          type="submit"
          class="bg-blue-600 hover:bg-blue-700 text-white px-8 py-3 rounded-lg"
        >
          Save Employee
        </button>

        <a
          href="{% url 'employee_list' %}"
          class="bg-gray-500 hover:bg-gray-600 text-white px-8 py-3 rounded-lg"
        >
          Cancel
        </a>
      </div>
    </form>
  </div>
</div>

{% endblock %}
