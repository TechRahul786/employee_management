{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %} {% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/output.css' %}" />
  </head>
  <body>
    {% if request.user.is_authenticated %}
    {% include "components/navbar.html" %}
    {% endif %}
    {% block content %} 
     {% if messages %} {% for message in messages %}

    <div
      class="mb-4 p-3 rounded-lg {% if message.tags == 'success' %} bg-green-100 text-green-700 border border-green-300 {% elif message.tags == 'error' %} bg-red-100 text-red-700 border border-red-300 {% elif message.tags == 'warning' %} bg-yellow-100 text-yellow-700 border border-yellow-300 {% elif message.tags == 'info' %} bg-blue-100 text-blue-700 border border-blue-300 {% endif %}"
    >
      {{ message }}
    </div>

    {% endfor %} {% endif %}
    {% endblock %}
  </body>
</html>
