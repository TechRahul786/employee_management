{% extends "base.html" %} {% block title %}Login{% endblock %} 
{% block content %}

<div
  class="min-h-screen flex items-center justify-center bg-gradient-to-r from-slate-900 via-blue-900 to-slate-900"
>
  <div class="w-full max-w-md bg-white rounded-2xl shadow-2xl p-8">
    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold text-slate-800">Employee Management</h1>

      <p class="text-gray-500 mt-2">Sign in to your account</p>
    </div>

     {% if messages %}
    {% for message in messages %}
        <div class="mb-4 p-3 rounded-lg
            {% if message.tags == 'error' %}
                bg-red-100 text-red-700 border border-red-300
            {% elif message.tags == 'success' %}
                bg-green-100 text-green-700 border border-green-300
            {% endif %}">
            {{ message }}
        </div>
    {% endfor %}
{% endif %}

    <form method="POST">
      {% csrf_token %}

      <div class="mb-4">
        <label class="block mb-2 font-medium"> Username </label>

        <input
          type="text"
          name="username"
          class="w-full border rounded-lg px-4 py-3 focus:ring-2 focus:ring-blue-500 outline-none"
          placeholder="Enter username"
        />
      </div>

      <div class="mb-6">
        <label class="block mb-2 font-medium"> Password </label>

        <input
          type="password"
          name="password"
          class="w-full border rounded-lg px-4 py-3 focus:ring-2 focus:ring-blue-500 outline-none"
          placeholder="Enter password"
        />
      </div>

      <button
      type="submit"
        class="w-full bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-lg font-semibold transition"
      >
        Login
      </button>
    </form>

    <p class="text-center mt-6">
      Don't have an account?

      <a href="{% url 'register' %}" class="text-blue-600 font-semibold">
        Register
      </a>
    </p>

   
  </div>
</div>

{% endblock %}
